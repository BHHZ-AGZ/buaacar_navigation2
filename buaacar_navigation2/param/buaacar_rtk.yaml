bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0 
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0   
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5  
    progress_checker_plugin: "progress_checker"
    allow_replanning: true  # 保留重规划，应对GPS轻微漂移
    emergency_stop_plugin: "emergency_stop"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.8  # 室外机器人半径可能更大，放宽到0.8m
      movement_time_allowance: 20.0  # 室外移动慢，时间容忍放宽到20s（原10s易超时）

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8  
      yaw_goal_tolerance: 0.5  

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4 
      max_vel_y: 0.0 
      max_vel_theta: 1.2  
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.5   
      acc_lim_y: 0.0
      acc_lim_theta: 2.0 
      decel_lim_x: -1.5  
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 15  
      vy_samples: 1
      vtheta_samples: 15  
      sim_time: 2.0 
      linear_granularity: 0.1  
      angular_granularity: 0.05  
      transform_tolerance: 0.8  
      xy_goal_tolerance: 0.8  
      trans_stopped_velocity: 0.3 
      short_circuit_trajectory_evaluation: True
      stateful: True
      # 批评家权重：室外优先保证路径跟踪和避障
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05  # 提高障碍物权重，优先避障
      PathAlign.scale: 25.0  # 降低路径对齐权重
      PathAlign.forward_point_distance: 0.3  # 前向点距离放宽提升稳定性）
      GoalAlign.scale: 20.0  # 降低目标对齐权重
      GoalAlign.forward_point_distance: 0.3
      PathDist.scale: 25.0  # 降低路径距离权重
      GoalDist.scale: 20.0  # 降低目标距离权重
      RotateToGoal.scale: 25.0  # 降低转向目标权重
      RotateToGoal.slowing_factor: 8.0  # 转向减速更平缓
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0  
      publish_frequency: 3.0
      global_frame: map  
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true  #室外保留
      width: 5.0  
      height: 5.0  
      resolution: 0.1  
      footprint: "[[0.44,0.275],[0.44,-0.275],[-0.11,-0.275],[-0.11,0.275]]" 
      plugins: ["obstacle_layer", "inflation_layer"]  
      inflation_layer:
        enabled: True
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0  
        inflation_radius: 1.2 
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.8 
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0  
          obstacle_max_range: 4.5  
      always_send_full_costmap: False  

  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0  
      publish_frequency: 0.5  
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.44,0.275],[0.44,-0.275],[-0.11,-0.275],[-0.11,0.275]]"
      resolution: 0.1  
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.8
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0 
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0 
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8  
      always_send_full_costmap: False  

  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False


map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.15
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0 
      use_astar: true  # 
      allow_unknown: true
      smooth_path: true
      angle: 0.05

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False


robot_state_publisher:
  ros__parameters:
    use_sim_time: False


velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "CLOSED_LOOP"
    max_velocity: [0.4, 0.0, 1.2]  
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [1.5, 0.0, 2.0]  
    max_decel: [-1.5, 0.0, -2.0]  
    odom_topic: "/fused/odom"  
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]  
    velocity_timeout: 2.0  